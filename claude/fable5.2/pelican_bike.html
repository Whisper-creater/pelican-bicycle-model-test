<script>
const NS='http://www.w3.org/2000/svg',$=i=>document.getElementById(i),TAU=Math.PI*2,D=180/Math.PI,W=1200;
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const wrap=(v,m)=>((v%m)+m)%m;
const INK='#2b2d42';
const WR=105,REAR=[380,610],FRONT=[780,610];
const BB=[580,610],CRANK=34;
const WHEEL_SPEED=4,GROUND_SPEED=WHEEL_SPEED*WR,CADENCE=2.2;
const HIP1=[570,456],HIP2=[562,454],THIGH=84,SHIN=96;

const each=f=>{for(let k=-1;k<3;k++)f(k*W)};
const tr=(id,x)=>$(id).setAttribute('transform','translate('+(-wrap(x,W)).toFixed(1)+',0)');
const LAY={m1:[560,[[70,1,.4],[30,3,1.7]],'#a9c9d6','#c9e0e8'],m2:[668,[[95,2,1.1],[36,5,.3]],'#6ea67c','#93c49d'],m3:[712,[[46,3,2.2],[18,7,.9]],'#44854f','#66a86f']};
for(const id in LAY){
const [b,ps,fill,hi]=LAY[id];
let s='',x;
for(x=-1200;x<=3600;x+=16)s+=(x>-1200?' L':'M')+x+','+ry(b,ps,x).toFixed(1);
mk('path',{d:'M-1200,1700 L'+s.slice(1)+' L3600,1700 Z',fill},$(id));
mk('path',{d:s,fill:'none',stroke:hi,'stroke-width':3,'stroke-opacity':.8},$(id));
}
each(o=>{
const lx=330+o,ly=ry(LAY.m2[0],LAY.m2[1],330)+6,g=mk('g',{transform:'translate('+lx+','+ly+')'},$('m2'));
mk('path',{d:'M-13,0 L-9,-62 H9 L13,0 Z',fill:'#f4f1ea',stroke:'#7b8190','stroke-width':2},g);
mk('path',{d:'M-12,-14 L-11,-30 H11 L12,-14 Z M-10,-46 L-9,-62 H9 L10,-46 Z',fill:'#c8473b'},g);

});
for(let i=0;i<9;i++){
const tx=(i*137.9+40)%W,ty=ry(LAY.m3[0],LAY.m3[1],tx)+5,r=13+(i*7)%8;
each(o=>{
mk('rect',{x:tx+o-2.5,y:ty-r,width:5,height:r+2,fill:'#5b4430'},$('m3'));
mk('circle',{cx:tx+o,cy:ty-r-6,r:r,fill:'#2f7a47'},$('m3'));

});
}
for(let i=0;i<26;i++){
const wx=(i*211.7)%W,wy=566+(i*37)%96;
each(o=>mk('path',{d:'M'+(wx+o)+','+wy+' q8,-5 16,0 q8,5 16,0',fill:'none',stroke:'#e8f6fb','stroke-width':2.2,'stroke-linecap':'round','stroke-opacity':.7},$('sea')));

each(o=>{

const a=i/16*TAU,r1=62,r2=(i%2?84:100);

[[0,0,34],[38,-14,40],[80,0,32],[40,10,36],[-30,8,24],[112,8,22]].forEach(p=>{

mk('circle',{cx:30*c[2],cy:-24*c[2],r:20*c[2],fill:'#ffffff'},g);
return [g,c];
});
const birds=[0,1,2].map(()=>mk('path',{fill:'none',stroke:'#3d405b','stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round'},$('birds')));

function knee(hx,hy,ax,ay,fwd){
const dx=ax-hx,dy=ay-hy,r=Math.hypot(dx,dy)||1;
const d=Math.min(r,THIGH+SHIN-.5);
const a=(THIGH*THIGH-SHIN*SHIN+d*d)/(2*d);
const h=Math.sqrt(Math.max(0,THIGH*THIGH-a*a));
const ux=dx/r,uy=dy/r,mx=hx+ux*a,my=hy+uy*a;
const k1=[mx-uy*h,my+ux*h],k2=[mx+uy*h,my-ux*h];
return (k1[0]>k2[0])===fwd?k1:k2;
}
function leg(id,hip,p,tilt,fwd){
const c=Math.cos(tilt/D),s=Math.sin(tilt/D);
const ax=p[0]+ANKLE[0]*c-ANKLE[1]*s,ay=p[1]+ANKLE[0]*s+ANKLE[1]*c;
const k=knee(hip[0],hip[1],ax,ay,fwd);
const d='M'+hip[0]+','+hip[1]+' L'+k[0].toFixed(1)+','+k[1].toFixed(1)+' L'+ax.toFixed(1)+','+ay.toFixed(1);
$('l'+id+'o').setAttribute('d',d);
$('l'+id+'c').setAttribute('d',d);
$('f'+id).setAttribute('transform','translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+') rotate('+tilt.toFixed(1)+')');
}
function draw(t){
const ca=t*CADENCE,wa=wrap(t*WHEEL_SPEED*D,360);
$('wr').setAttribute('transform','translate('+REAR+') rotate('+wa+')');
$('wf').setAttribute('transform','translate('+FRONT+') rotate('+wa+')');
$('cog').setAttribute('transform','translate('+REAR+') rotate('+wa+')');
$('ring').setAttribute('transform','translate('+BB+') rotate('+wrap(ca*D,360)+')');
const c=Math.cos(ca),s=Math.sin(ca);
const p1=[BB[0]+CRANK*c,BB[1]+CRANK*s],p2=[BB[0]-CRANK*c,BB[1]-CRANK*s];
$('cr1').setAttribute('x2',p1[0]);
$('cr1').setAttribute('y2',p1[1]);
$('cr1h').setAttribute('x2',p1[0]);
$('cr1h').setAttribute('y2',p1[1]);
$('cr2').setAttribute('x2',p2[0]);
$('cr2').setAttribute('y2',p2[1]);
$('cr2h').setAttribute('x2',p2[0]);
$('cr2h').setAttribute('y2',p2[1]);
$('pd1').setAttribute('transform','translate('+p1+')');
$('pd2').setAttribute('transform','translate('+p2+')');
leg(1,HIP1,p1,8+13*Math.sin(ca-.5),true);
leg(2,HIP2,p2,8+13*Math.sin(ca+Math.PI-.5),true);
const bob=Math.sin(ca*2)*1.6,lean=Math.sin(ca*2+1)*.5,nod=Math.sin(ca)*2;
$('pelican').setAttribute('transform','translate(0,'+bob.toFixed(2)+') rotate('+lean.toFixed(2)+',548,440)');
$('hd').setAttribute('transform','rotate('+nod.toFixed(2)+',690,300)');
$('pouch').setAttribute('transform','translate(0,'+(Math.sin(t*4.4+.9)*1.4).toFixed(2)+')');
$('eye').setAttribute('transform','translate(0,222) scale(1,'+(wrap(t+1.2,3.6)<.13?.12:1)+') translate(0,-222)');
const w=Math.sin(t*7),v=Math.sin(t*7-1.1);
$('pl1').setAttribute('d','M700,204 q-14,'+(-16+w*3)+' -32,'+(-14+w*6));
$('pl2').setAttribute('d','M694,209 q-16,'+(-8+v*3)+' -36,'+(-2+v*6));
$('pl3').setAttribute('d','M690,216 q-14,'+(-2+w*3)+' -30,'+(8+w*5));
[0,1,2,3].forEach(i=>{
const q=wrap(t*300+i*90,260),x=330-q,y=548+i*40;
$('sp'+i).setAttribute('d','M'+x.toFixed(1)+','+y+' h'+(-40-i*14));
$('sp'+i).setAttribute('opacity',(1-q/260).toFixed(2));
});
[0,1,2,3,4].forEach(i=>{
const u=wrap(t*1.1+i*.2,1),el=$('du'+i);
el.setAttribute('cx',(380-u*130).toFixed(1));
el.setAttribute('cy',(716-u*16-Math.sin(u*3+i)*3).toFixed(1));
el.setAttribute('r',(3+u*9).toFixed(1));
el.setAttribute('opacity',(.4*(1-u)).toFixed(2));
});
tr('m1',t*10*K);
tr('sea',t*20*K);
tr('m2',t*34*K);
tr('m3',t*80*K);
tr('gd',t*GROUND_SPEED);
tr('rd',t*GROUND_SPEED);
tr('fg',t*GROUND_SPEED*1.35);
$('rays').setAttribute('transform','rotate('+wrap(t*8,360).toFixed(1)+')');
clouds.forEach(([g,cc])=>g.setAttribute('transform','translate('+(1900-wrap(t*cc[3]+cc[0],2900)).toFixed(1)+','+cc[1]+')'));
birds.forEach((b,i)=>{
const x=1700-wrap(t*26+i*640,2500),y=120+i*46+Math.sin(t*1.3+i)*9,f=6+Math.sin(t*6+i*2)*6;
b.setAttribute('d','M-16,'+(-f).toFixed(1)+' Q-8,'+(-f-4).toFixed(1)+' 0,0 Q8,'+(-f-4).toFixed(1)+' 16,'+(-f).toFixed(1));
b.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+') scale('+(.8+i*.2)+')');
});
}
let t0=null;
function frame(ts){if(t0===null)t0=ts;draw((ts-t0)/1000);requestAnimationFrame(frame)}
if(matchMedia('(prefers-reduced-motion: reduce)').matches)draw(.9);else requestAnimationFrame(frame);
