<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  html,body{margin:0;height:100%;background:#15171b;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  svg{width:100vw;height:100vh;display:block;overflow:hidden}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- ===== 环境 ===== -->
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3f78bd"/>
    <stop offset="0.45" stop-color="#8dbbe4"/>
    <stop offset="0.72" stop-color="#d9e6ee"/>
    <stop offset="0.85" stop-color="#f6e3c3"/>
    <stop offset="1" stop-color="#f3d29e"/>
  </linearGradient>
  <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fffbe8" stop-opacity="1"/>
    <stop offset="0.18" stop-color="#fff2c4" stop-opacity="0.9"/>
    <stop offset="0.45" stop-color="#ffe7a8" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#ffe7a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="mtn2Grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a9bcd2"/>
    <stop offset="1" stop-color="#d4dde5"/>
  </linearGradient>
  <linearGradient id="mtn1Grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7e97b2"/>
    <stop offset="0.6" stop-color="#a8b9c8"/>
    <stop offset="1" stop-color="#c9d3d6"/>
  </linearGradient>
  <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7ea65a"/>
    <stop offset="1" stop-color="#557f3c"/>
  </linearGradient>
  <linearGradient id="fieldGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a5cc66"/>
    <stop offset="1" stop-color="#78a646"/>
  </linearGradient>
  <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#55555a"/>
    <stop offset="0.3" stop-color="#46464b"/>
    <stop offset="1" stop-color="#2b2b2f"/>
  </linearGradient>
  <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="blurCloud" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3.5"/></filter>
  <filter id="blurShadow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="softDrop" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3a2a28" flood-opacity="0.22"/>
  </filter>

  <!-- ===== 金属 / 车架 ===== -->
  <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4f6f8"/>
    <stop offset="0.5" stop-color="#a8aeb4"/>
    <stop offset="1" stop-color="#e3e6e9"/>
  </linearGradient>
  <radialGradient id="hubGrad" cx="0.35" cy="0.35" r="0.7">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.5" stop-color="#b9bec4"/>
    <stop offset="1" stop-color="#6c7278"/>
  </radialGradient>
  <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.45" stop-color="#b6bcc2"/>
    <stop offset="0.55" stop-color="#8a9096"/>
    <stop offset="1" stop-color="#dfe3e6"/>
  </linearGradient>
  <linearGradient id="leatherGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a0643a"/>
    <stop offset="1" stop-color="#5c3218"/>
  </linearGradient>

  <!-- ===== 鹈鹕 ===== -->
  <linearGradient id="plumage" gradientUnits="userSpaceOnUse" x1="0" y1="85" x2="0" y2="370">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.55" stop-color="#fbf3ee"/>
    <stop offset="1" stop-color="#e6cfc6"/>
  </linearGradient>
  <linearGradient id="plumageFar" gradientUnits="userSpaceOnUse" x1="0" y1="85" x2="0" y2="370">
    <stop offset="0" stop-color="#e4dcd8"/>
    <stop offset="1" stop-color="#bfaea7"/>
  </linearGradient>
  <radialGradient id="bodyShade" gradientUnits="userSpaceOnUse" cx="560" cy="270" r="150">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="0.6" stop-color="#d9b9ae" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#8a6458" stop-opacity="0.45"/>
  </radialGradient>
  <radialGradient id="breastFlush" gradientUnits="userSpaceOnUse" cx="640" cy="300" r="70">
    <stop offset="0" stop-color="#f6c9b8" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#f6c9b8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="billGrad" gradientUnits="userSpaceOnUse" x1="672" y1="100" x2="846" y2="175">
    <stop offset="0" stop-color="#e9b9a6"/>
    <stop offset="0.35" stop-color="#eec3a3"/>
    <stop offset="0.75" stop-color="#f1d083"/>
    <stop offset="1" stop-color="#eaa25c"/>
  </linearGradient>
  <linearGradient id="billTop" gradientUnits="userSpaceOnUse" x1="0" y1="95" x2="0" y2="175">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="pouchGrad" gradientUnits="userSpaceOnUse" x1="0" y1="128" x2="0" y2="212">
    <stop offset="0" stop-color="#fbd667"/>
    <stop offset="0.5" stop-color="#f4ad3a"/>
    <stop offset="1" stop-color="#df7d27"/>
  </linearGradient>
  <linearGradient id="flightGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a4a52"/>
    <stop offset="0.5" stop-color="#232328"/>
    <stop offset="1" stop-color="#121215"/>
  </linearGradient>
  <linearGradient id="legGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f6b088"/>
    <stop offset="1" stop-color="#e48a5e"/>
  </linearGradient>

  <!-- clip 路径 -->
  <path id="bodyPath" d="M606 232 C560 226 500 244 456 272 C440 282 426 290 414 296 C420 304 436 310 456 312 C480 340 528 362 575 362 C626 360 664 328 670 288 C673 264 662 246 646 238 C634 232 620 230 606 232 Z"/>
  <path id="wingPath" d="M612 246 C652 258 684 292 702 324 C706 332 700 340 690 342 C640 352 570 348 512 318 C494 310 478 302 466 294 C500 276 570 248 612 246 Z"/>
  <path id="neckPath" d="M598 242 C630 212 612 178 626 140 L672 148 C690 192 704 240 668 292 Z"/>
  <path id="pouchPath" d="M668 150 C676 195 716 214 758 210 C796 206 818 190 828 175 C784 162 728 144 684 127 C678 134 672 142 668 150 Z"/>
  <clipPath id="bodyClip"><use href="#bodyPath"/></clipPath>
  <clipPath id="wingClip"><use href="#wingPath"/></clipPath>
  <clipPath id="neckClip"><use href="#neckPath"/></clipPath>
  <clipPath id="pouchClip"><use href="#pouchPath"/></clipPath>
</defs>

<!-- ======== 天空 ======== -->
<rect x="0" y="0" width="1200" height="700" fill="url(#skyGrad)"/>
<circle cx="985" cy="125" r="190" fill="url(#sunGlow)"/>
<circle cx="985" cy="125" r="34" fill="#fffaf0"/>
<g id="clouds"></g>
<g id="birds"></g>

<!-- ======== 远景 ======== -->
<g id="mtn2"></g>
<g id="mtn1"></g>
<g id="hills"></g>
<g id="field"></g>

<!-- ======== 道路 ======== -->
<rect x="0" y="556" width="1200" height="144" fill="url(#roadGrad)"/>
<g id="roadTex"></g>
<rect x="0" y="553" width="1200" height="6" fill="#bdb6a6"/>
<rect x="0" y="558" width="1200" height="2" fill="#7d776c"/>
<rect x="0" y="574" width="1200" height="3" fill="#ece8dc" opacity="0.85"/>
<g id="roadMarks"></g>
<g id="verge"></g>

<g id="streaks"></g>
<g id="dust"></g>

<!-- 阴影 -->
<ellipse cx="600" cy="603" rx="250" ry="8" fill="#000" opacity="0.38" filter="url(#blurShadow)"/>
<ellipse cx="430" cy="601" rx="34" ry="3.5" fill="#000" opacity="0.45" filter="url(#blur2)"/>
<ellipse cx="770" cy="601" rx="34" ry="3.5" fill="#000" opacity="0.45" filter="url(#blur2)"/>

<!-- ======== 远侧腿 & 曲柄 ======== -->
<g id="farLeg"></g>

<!-- ======== 自行车 ======== -->
<g id="bike"></g>

<!-- ======== 鹈鹕（身体） ======== -->
<g id="pelicanBack"></g>
<!-- 近侧曲柄 + 腿 -->
<g id="nearLeg"></g>
<!-- 近侧翅膀 -->
<g id="pelicanFront"></g>

</svg>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const W = 1200;
const $ = id => document.getElementById(id);
function E(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const TAU = Math.PI*2, deg = r => r*180/Math.PI;
const f1 = n => n.toFixed(1);

/* ---------- 可平铺图层（三份拷贝保证无缝） ---------- */
function tiled(layer, buildTile){
  const tile = E('g', null, layer);
  buildTile(tile);
  for (const k of [-1, 1]){
    const c = tile.cloneNode(true);
    c.setAttribute('transform', `translate(${k*W},0)`);
    layer.appendChild(c);
  }
}
function periodic(x, base, terms){
  let y = base;
  for (const [a,k,p] of terms) y += a*Math.sin(TAU*k*x/W + p);
  return y;
}
function ridgePath(base, terms, bottom){
  let d = `M0 ${f1(periodic(0,base,terms))}`;
  for (let x=6; x<=W; x+=6) d += ` L${x} ${f1(periodic(x,base,terms))}`;
  return d + ` L${W} ${bottom} L0 ${bottom} Z`;
}

/* ---------- 云 ---------- */
const clouds = [];
(function(){
  const r = rng(7), g = $('clouds');
  const defs = [[120,95,1.1],[460,60,0.8],[760,150,0.9],[1100,80,1.2],[1400,180,0.7],[300,200,0.6]];
  for (const [x,y,s] of defs){
    const c = E('g', {opacity: 0.92}, g);
    const inner = E('g', {transform:`scale(${s})`, filter:'url(#blurCloud)'}, c);
    const n = 6 + Math.floor(r()*4);
    E('ellipse', {cx:0, cy:16, rx:95, ry:16, fill:'#d9dde6'}, inner);
    for (let i=0;i<n;i++){
      const cx = -80 + i*(160/(n-1)) + (r()-0.5)*14;
      const rr = 18 + r()*26 * (1 - Math.abs(i-(n-1)/2)/(n));
      E('circle', {cx, cy: 6 - rr*0.55, r: rr, fill:'#ffffff'}, inner);
    }
    E('ellipse', {cx:0, cy:20, rx:88, ry:9, fill:'#c9cfdb', opacity:0.7}, inner);
    clouds.push({el:c, x, y, s, v: 6 + r()*6});
  }
})();

/* ---------- 远处的鸟 ---------- */
const birds = [];
(function(){
  const g = $('birds');
  for (let i=0;i<4;i++){
    const b = E('path', {fill:'none', stroke:'#3d4a5c', 'stroke-width':1.4, 'stroke-linecap':'round', opacity:0.65}, g);
    birds.push({el:b, x: 820 + i*38, y: 70 + (i%2)*16 + i*6, ph: i*1.3});
  }
})();

/* ---------- 山脉 / 丘陵 ---------- */
const M2 = [[22,1,0.4],[16,3,1.9],[9,5,0.2],[5,11,2.4]];
const M1 = [[34,1,2.1],[22,2,0.7],[14,4,2.8],[7,9,1.1],[3,17,0.3]];
const HL = [[10,2,1.0],[7,5,2.0],[3,9,0.5]];
tiled($('mtn2'), t => {
  E('path', {d: ridgePath(352, M2, 560), fill:'url(#mtn2Grad)'}, t);
});
tiled($('mtn1'), t => {
  E('path', {d: ridgePath(398, M1, 560), fill:'url(#mtn1Grad)'}, t);
  // 雪线 / 山体纹理
  const r = rng(11); let d='';
  for (let i=0;i<70;i++){
    const x = r()*W, y0 = periodic(x,398,M1);
    const len = 8 + r()*20;
    d += `M${f1(x)} ${f1(y0+3)} l${f1(-len*0.35)} ${f1(len)} `;
  }
  E('path', {d, stroke:'#6d859f', 'stroke-width':1, opacity:0.12, fill:'none'}, t);
  E('rect', {x:0, y:430, width:W, height:130, fill:'#dfe6ea', opacity:0.25}, t);
});

function tree(p, x, y, s, type, r){
  E('ellipse', {cx:x+4*s, cy:y+1, rx:16*s, ry:3*s, fill:'#2d4a22', opacity:0.25}, p);
  if (type === 0){
    E('rect', {x:x-2.5*s, y:y-26*s, width:5*s, height:27*s, fill:'#5b4030'}, p);
    const blobs = [[0,-44,19],[-13,-34,14],[13,-35,15],[0,-58,14],[-8,-50,12],[9,-50,12]];
    for (const [dx,dy,rr] of blobs) E('circle', {cx:x+dx*s, cy:y+dy*s, r:rr*s, fill:'#3d6a2c'}, p);
    for (const [dx,dy,rr] of blobs) E('circle', {cx:x+(dx-4)*s, cy:y+(dy-5)*s, r:rr*0.55*s, fill:'#5f9241', opacity:0.75}, p);
    E('circle', {cx:x+10*s, cy:y-36*s, r:10*s, fill:'#2c5121', opacity:0.5}, p);
  } else {
    E('rect', {x:x-1.6*s, y:y-10*s, width:3.2*s, height:11*s, fill:'#4f3626'}, p);
    E('ellipse', {cx:x, cy:y-46*s, rx:10*s, ry:40*s, fill:'#30592a'}, p);
    E('ellipse', {cx:x-3*s, cy:y-50*s, rx:5*s, ry:32*s, fill:'#4d8139', opacity:0.75}, p);
  }
}
tiled($('hills'), t => {
  E('path', {d: ridgePath(452, HL, 560), fill:'url(#hillGrad)'}, t);
  const r = rng(23);
  // 田垄
  let d='';
  for (let i=0;i<8;i++){
    const y = 470 + i*9;
    d += `M0 ${y} `;
    for (let x=0;x<=W;x+=20) d += `L${x} ${f1(y + 2*Math.sin(TAU*3*x/W + i))} `;
  }
  E('path', {d, stroke:'#9cc070', 'stroke-width':1.2, opacity:0.35, fill:'none'}, t);
  // 小农舍
  const hx = 350, hy = periodic(350,452,HL)+16;
  E('rect', {x:hx, y:hy-18, width:30, height:18, fill:'#efe4d0'}, t);
  E('path', {d:`M${hx-3} ${hy-18} L${hx+15} ${hy-31} L${hx+33} ${hy-18} Z`, fill:'#a2412f'}, t);
  E('rect', {x:hx+5, y:hy-12, width:6, height:6, fill:'#6b5a48'}, t);
  E('rect', {x:hx+18, y:hy-12, width:7, height:12, fill:'#7a4a2a'}, t);
  const trees = [];
  for (let i=0;i<22;i++){
    const x = r()*W; const yb = periodic(x,452,HL) + 6 + r()*40;
    trees.push([x,yb]);
  }
  trees.sort((a,b)=>a[1]-b[1]);
  for (const [x,y] of trees) tree(t, x, y, 0.38 + (y-450)/110*0.4, r()<0.35?1:0, r);
});
tiled($('field'), t => {
  const FT = [[4,3,0.5],[2,7,1.4]];
  E('path', {d: ridgePath(512, FT, 560), fill:'url(#fieldGrad)'}, t);
  const r = rng(31);
  // 灌木
  for (let i=0;i<9;i++){
    const x = r()*W, y = 522 + r()*6, s = 0.7 + r()*0.6;
    E('ellipse', {cx:x, cy:y, rx:26*s, ry:12*s, fill:'#4f7f36'}, t);
    E('ellipse', {cx:x-6*s, cy:y-4*s, rx:15*s, ry:6*s, fill:'#6fa24a', opacity:0.8}, t);
  }
  // 草纹 + 野花
  let d='';
  for (let i=0;i<500;i++){
    const x = r()*W, y = 518 + r()*38, h = 3 + r()*5;
    d += `M${f1(x)} ${f1(y)} q${f1((r()-0.3)*3)} ${f1(-h*0.5)} ${f1((r()-0.2)*4)} ${f1(-h)} `;
  }
  E('path', {d, stroke:'#5e8f38', 'stroke-width':1, fill:'none', opacity:0.7}, t);
  const cols = ['#ffffff','#f7e36a','#ef7b98','#c49be8'];
  for (let i=0;i<140;i++){
    E('circle', {cx:f1(r()*W), cy:f1(522 + r()*32), r:f1(0.9 + r()*1.2), fill:cols[Math.floor(r()*4)], opacity:0.9}, t);
  }
  // 木栅栏
  E('line', {x1:0, y1:521, x2:W, y2:521, stroke:'#8b6b49', 'stroke-width':2.5}, t);
  E('line', {x1:0, y1:535, x2:W, y2:535, stroke:'#7d5f40', 'stroke-width':2.5}, t);
  for (let x=20; x<W; x+=100){
    E('rect', {x, y:510, width:6, height:42, fill:'#8a6846'}, t);
    E('rect', {x:x+4, y:510, width:2, height:42, fill:'#5e4530'}, t);
    E('path', {d:`M${x} 510 L${x+3} 506 L${x+6} 510 Z`, fill:'#9b7a56'}, t);
  }
});

/* ---------- 路面 ---------- */
tiled($('roadTex'), t => {
  const r = rng(41); let a='', b='';
  for (let i=0;i<900;i++){
    const x = f1(r()*W), y = f1(562 + r()*136);
    if (r()<0.5) a += `M${x} ${y}h1.2 `; else b += `M${x} ${y}h1.6 `;
  }
  E('path', {d:a, stroke:'#8a8a90', 'stroke-width':1.2, opacity:0.45}, t);
  E('path', {d:b, stroke:'#1e1e21', 'stroke-width':1.6, opacity:0.5}, t);
  // 裂缝 / 补丁
  for (let i=0;i<4;i++){
    const x = r()*W, y = 600 + r()*80;
    E('path', {d:`M${f1(x)} ${f1(y)} l12 3 l9 -4 l14 5 l6 -2`, stroke:'#26262a', 'stroke-width':1.2, fill:'none', opacity:0.7}, t);
  }
  E('ellipse', {cx:f1(r()*W), cy:680, rx:60, ry:7, fill:'#3a3a3e', opacity:0.6}, t);
});
(function(){
  const g = $('roadMarks');
  for (let x=-140; x<W+280; x+=140){
    E('rect', {x, y:652, width:72, height:6, rx:1, fill:'#efe7c4', opacity:0.9}, g);
  }
})();
tiled($('verge'), t => {
  const r = rng(51); let d='', d2='';
  for (let i=0;i<420;i++){
    const x = r()*W, h = 5 + r()*12, lean = (r()-0.4)*7;
    const s = `M${f1(x)} 556 q${f1(lean*0.3)} ${f1(-h*0.6)} ${f1(lean)} ${f1(-h)} `;
    if (r()<0.5) d += s; else d2 += s;
  }
  E('path', {d, stroke:'#5f8f36', 'stroke-width':1.6, fill:'none', 'stroke-linecap':'round'}, t);
  E('path', {d:d2, stroke:'#86b450', 'stroke-width':1.3, fill:'none', 'stroke-linecap':'round'}, t);
  for (let i=0;i<5;i++){
    const x = r()*W;
    E('ellipse', {cx:x, cy:555, rx:4+r()*4, ry:2.5, fill:'#8f8a80'}, t);
    E('ellipse', {cx:x-1, cy:554, rx:2, ry:1, fill:'#c8c2b6'}, t);
  }
});

/* ---------- 风线 ---------- */
const streaks = [];
(function(){
  const r = rng(61), g = $('streaks');
  for (let i=0;i<9;i++){
    const len = 50 + r()*120;
    const l = E('line', {x1:0, y1:0, x2:len, y2:0, stroke:'#ffffff', 'stroke-width':1.3, 'stroke-linecap':'round', opacity:0.25 + r()*0.2}, g);
    streaks.push({el:l, x:r()*1400, y:140 + r()*380, v:1.4 + r()*0.8});
  }
})();

/* ---------- 尘土粒子 ---------- */
const dustG = $('dust'), dust = [];
for (let i=0;i<16;i++){
  dust.push({el:E('circle', {r:2, fill:'#b8ab95', opacity:0}, dustG), born:-10, life:1, x:0,y:0,vx:0,vy:0,r0:2});
}

/* ======================================================
   自行车
   ====================================================== */
const bike = $('bike');
const R = {x:430, y:505}, F = {x:770, y:505}, B = {x:585, y:525};
const WR = 95, CRANK = 40;

function wheel(c){
  const g = E('g', {transform:`translate(${c.x},${c.y})`}, bike);
  E('circle', {r:95, fill:'none', stroke:'#1c1c1e', 'stroke-width':12}, g);
  E('circle', {r:90.5, fill:'none', stroke:'#9a7b55', 'stroke-width':3.2}, g);   // 黄边胎
  E('circle', {r:91.8, fill:'none', stroke:'#c19a6a', 'stroke-width':0.8, opacity:0.7}, g);
  const rot = E('g', null, g);
  E('circle', {r:100.6, fill:'none', stroke:'#3a3a3d', 'stroke-width':2.2, 'stroke-dasharray':'2.5 3.5'}, rot); // 胎纹

function bez(p, t){
  const u=1-t;
  return {
    x: u*u*u*p[0][0] + 3*u*u*t*p[1][0] + 3*u*t*t*p[2][0] + t*t*t*p[3][0],
    y: u*u*u*p[0][1] + 3*u*u*t*p[1][1] + 3*u*t*t*p[2][1] + t*t*t*p[3][1],
    tx: 3*u*u*(p[1][0]-p[0][0]) + 6*u*t*(p[2][0]-p[1][0]) + 3*t*t*(p[3][0]-p[2][0]),
    ty: 3*u*u*(p[1][1]-p[0][1]) + 6*u*t*(p[2][1]-p[1][1]) + 3*t*t*(p[3][1]-p[2][1])
  };
}
function featherD(L, w){
  return `M0 ${f1(-w*0.45)} C${f1(L*0.35)} ${f1(-w*0.62)} ${f1(L*0.82)} ${f1(-w*0.5)} ${f1(L)} 0 C${f1(L*0.86)} ${f1(w*0.55)} ${f1(L*0.35)} ${f1(w*0.6)} 0 ${f1(w*0.45)} Z`;
}
function feather(p, x, y, ang, L, w, fill, stroke, rachis){

}

/* ======================================================
   腿 & 曲柄
   ====================================================== */
function makeLeg(parent, far){
  const g = E('g', null, parent);
  const thighC = far ? 'url(#plumageFar)' : 'url(#plumage)';
  const skin = far ? '#c97a57' : 'url(#legGrad)';
  const skinFlat = far ? '#c97a57' : '#ee9b6f';
  const L = {};
  L.crank = E('line', {stroke: far ? '#8a9096' : 'url(#chromeGrad)', 'stroke-width':9, 'stroke-linecap':'round'}, g);
  L.crankHi = E('line', {stroke:'#ffffff', 'stroke-width':2, 'stroke-linecap':'round', opacity: far?0.2:0.6}, g);
  L.bolt = E('circle', {r:4.5, fill: far ? '#666' : 'url(#hubGrad)'}, g);
  L.pedal = E('g', null, g);
  E('rect', {x:-15, y:-3.5, width:30, height:8, rx:2, fill: far ? '#1f1f22' : '#2a2a2e'}, L.pedal);
  E('rect', {x:-13, y:-2.5, width:26, height:2, fill:'#55555c'}, L.pedal);
  E('rect', {x:-15, y:1, width:5, height:3, fill:'#e06a1c', opacity: far?0.5:1}, L.pedal);
  E('rect', {x:10, y:1, width:5, height:3, fill:'#e06a1c', opacity: far?0.5:1}, L.pedal);
  L.shin = E('line', {stroke:skinFlat, 'stroke-width':10, 'stroke-linecap':'round'}, g);
  L.shinScale = E('line', {stroke:'#9a4a26', 'stroke-width':10, 'stroke-dasharray':'1 3.2', opacity:0.35}, g);
  L.shinHi = E('line', {stroke:'#ffd2b8', 'stroke-width':2, 'stroke-linecap':'round', opacity: far?0.15:0.55}, g);
  L.thighBare = E('line', {stroke:skinFlat, 'stroke-width':11.5, 'stroke-linecap':'round'}, g);
  L.knee = E('circle', {r:7, fill: far ? '#b86a48' : '#e48a5e'}, g);
  L.thigh = E('path', {fill:thighC}, g);
  L.thighTex = E('path', {fill:'none', stroke: far ? '#9e8a83' : '#c4a69c', 'stroke-width':0.7, opacity:0.6}, g);
  L.foot = E('g', null, g);
  E('path', {d:'M-4 0 C8 2 22 4 34 7 C37 8 37 11 33 11 C29 11 31 13 28 14.5 C24 15.5 22 16.5 18 15.5 C11 13.5 4 10 -3 7 Z', fill: far ? '#a85e40' : '#e9875a'}, L.foot);
  E('path', {d:'M-2 4 C10 6 22 8 33 9 M-1 6 C9 9 18 12 28 13.5 M0 7 C7 10 13 13 19 15', stroke: far ? '#d08a66' : '#ffc09c', 'stroke-width':2, fill:'none', 'stroke-linecap':'round'}, L.foot);
  E('path', {d:'M33 9 l3 0.5 M28 13.5 l2.5 1.2 M19 15 l2 1.5', stroke:'#3a2a22', 'stroke-width':1.4, 'stroke-linecap':'round'}, L.foot); // 爪
  E('path', {d:'M-2 4 L-10 9', stroke: skinFlat, 'stroke-width':3, 'stroke-linecap':'round'}, L.foot); // 后趾
  E('circle', {cx:-1, cy:2, r:5.5, fill:skinFlat}, L.foot);
  L.far = far;
  return L;
}
const farLeg = makeLeg($('farLeg'), true);
const nearLeg = makeLeg($('nearLeg'), false);
const THIGH = 110, SHIN = 120;

function setLine(el, a, b){ el.setAttribute('x1',f1(a.x)); el.setAttribute('y1',f1(a.y)); el.setAttribute('x2',f1(b.x)); el.setAttribute('y2',f1(b.y)); }
function ik(h, a){
  let dx=a.x-h.x, dy=a.y-h.y, d=Math.hypot(dx,dy);
  d = Math.min(d, THIGH+SHIN-0.5);
  const base = Math.atan2(dy,dx);
  const c = (THIGH*THIGH + d*d - SHIN*SHIN)/(2*THIGH*d);
  const al = Math.acos(Math.max(-1,Math.min(1,c)));
  const k1 = {x:h.x+THIGH*Math.cos(base-al), y:h.y+THIGH*Math.sin(base-al)};
  const k2 = {x:h.x+THIGH*Math.cos(base+al), y:h.y+THIGH*Math.sin(base+al)};
  return k1.x > k2.x ? k1 : k2; // 膝盖朝前
}
function updateLeg(L, hip, theta, t){
  const pedal = {x:B.x + CRANK*Math.cos(theta), y:B.y + CRANK*Math.sin(theta)};
  setLine(L.crank, B, pedal);
  setLine(L.crankHi, {x:B.x, y:B.y-1.5}, {x:pedal.x, y:pedal.y-1.5});
  L.bolt.setAttribute('cx', f1(pedal.x)); L.bolt.setAttribute('cy', f1(pedal.y));
  const tilt = 8*Math.sin(theta + 0.6);
  L.pedal.setAttribute('transform', `translate(${f1(pedal.x)} ${f1(pedal.y)}) rotate(${f1(tilt)})`);
  const fa = (tilt - 4) * Math.PI/180;
  const ankle = {x: pedal.x + (-9)*Math.cos(fa) - (-15)*Math.sin(fa), y: pedal.y + (-9)*Math.sin(fa) + (-15)*Math.cos(fa)};
  const knee = ik(hip, ankle);
  L.foot.setAttribute('transform', `translate(${f1(ankle.x)} ${f1(ankle.y)}) rotate(${f1(tilt-4)})`);
  setLine(L.shin, knee, ankle);
  setLine(L.shinScale, knee, ankle);
  const sdx=ankle.x-knee.x, sdy=ankle.y-knee.y, sl=Math.hypot(sdx,sdy);
  setLine(L.shinHi, {x:knee.x - sdy/sl*3, y:knee.y + sdx/sl*3 - 0}, {x:ankle.x - sdy/sl*3, y:ankle.y + sdx/sl*3});
  const mid = {x: hip.x + (knee.x-hip.x)*0.55, y: hip.y + (knee.y-hip.y)*0.55};
  setLine(L.thighBare, mid, knee);
  L.knee.setAttribute('cx', f1(knee.x)); L.knee.setAttribute('cy', f1(knee.y));
  // 羽毛覆盖的大腿：锥形
  const tdx = knee.x-hip.x, tdy = knee.y-hip.y, tl = Math.hypot(tdx,tdy);
  const nx = -tdy/tl, ny = tdx/tl;
  const e = {x: hip.x + tdx*0.62, y: hip.y + tdy*0.62};
  const w0 = 19, w1 = 8;
  L.thigh.setAttribute('d',
    `M${f1(hip.x+nx*w0)} ${f1(hip.y+ny*w0)} ` +
    `Q${f1(e.x+nx*w1*2.2)} ${f1(e.y+ny*w1*2.2)} ${f1(e.x+nx*w1)} ${f1(e.y+ny*w1)} ` +
    `Q${f1(e.x+tdx/tl*6)} ${f1(e.y+tdy/tl*6)} ${f1(e.x-nx*w1)} ${f1(e.y-ny*w1)} ` +
    `Q${f1(e.x-nx*w1*2.2)} ${f1(e.y-ny*w1*2.2)} ${f1(hip.x-nx*w0)} ${f1(hip.y-ny*w0)} Z`);
  let d='';
  for (let s=0.15; s<0.6; s+=0.1){
    const px = hip.x+tdx*s, py = hip.y+tdy*s, ww = w0 + (w1-w0)*s/0.62;
    d += `M${f1(px+nx*ww*0.7)} ${f1(py+ny*ww*0.7)} Q${f1(px+tdx/tl*6)} ${f1(py+tdy/tl*6)} ${f1(px-nx*ww*0.7)} ${f1(py-ny*ww*0.7)} `;
  }
  L.thighTex.setAttribute('d', d);
  return pedal;
}

/* ======================================================
   动画循环
   ====================================================== */
const SPEED = 380;              // 地面速度 px/s
const layers = [
  [$('mtn2'), 0.03], [$('mtn1'), 0.07], [$('hills'), 0.25], [$('field'), 0.62],
  [$('roadTex'), 1], [$('verge'), 1]
];
const roadMarks = $('roadMarks');
let start = null, lastBlink = 0, nextBlink = 2.5, dustTimer = 0, lastT = 0;

function frame(now){
  if (start === null) start = now;
  const t = (now - start)/1000;
  const dt = Math.min(0.05, t - lastT); lastT = t;
  const dist = t*SPEED;

  for (const [g, k] of layers) g.setAttribute('transform', `translate(${f1(-((dist*k)%W))} 0)`);
  roadMarks.setAttribute('transform', `translate(${f1(-(dist%140))} 0)`);

  for (const c of clouds){
    const x = ((c.x - t*(c.v + SPEED*0.02)) % 1600 + 1600) % 1600 - 200;
    c.el.setAttribute('transform', `translate(${f1(x)} ${c.y})`);
  }
  for (const b of birds){
    const x = ((b.x - t*14) % 1500 + 1500) % 1500 - 150;
    const y = b.y + Math.sin(t*0.8 + b.ph)*4;
    const flap = Math.sin(t*7 + b.ph)*4;
    b.el.setAttribute('d', `M${f1(x-7)} ${f1(y-flap)} Q${f1(x-3)} ${f1(y-3)} ${f1(x)} ${f1(y)} Q${f1(x+3)} ${f1(y-3)} ${f1(x+7)} ${f1(y-flap)}`);
  }
  for (const s of streaks){
    const x = ((s.x - dist*s.v) % 1500 + 1500) % 1500 - 200;
    s.el.setAttribute('transform', `translate(${f1(x)} ${f1(s.y)})`);
  }

  // 车轮与传动
  const wAng = dist / WR;                     // 弧度
  const theta = wAng / 1.55;                  // 曲柄角
  rearRot.setAttribute('transform', `rotate(${f1(deg(wAng))})`);
  frontRot.setAttribute('transform', `rotate(${f1(deg(wAng))})`);
  cogRot.setAttribute('transform', `rotate(${f1(deg(wAng))} ${R.x} ${R.y})`);
  ring.setAttribute('transform', `rotate(${f1(deg(theta))} ${B.x} ${B.y})`);
  const chainS = theta*37;
  chainTop.setAttribute('stroke-dashoffset', f1(-chainS % 4.8));
  chainBot.setAttribute('stroke-dashoffset', f1(chainS % 4.8));

  // 身体起伏
  const bob = 1.8*Math.sin(2*theta + 0.4);
  const sway = 0.6*Math.sin(2*theta);
  const bodyT = `translate(0 ${f1(bob)}) rotate(${sway.toFixed(2)} 560 330)`;
  back.setAttribute('transform', bodyT);
  front.setAttribute('transform', bodyT);

  // 头、喉囊、羽冠
  const nod = 1.6*Math.sin(2*theta + 1.2) + 0.6*Math.sin(t*1.3);
  head.setAttribute('transform', `rotate(${nod.toFixed(2)} 630 150)`);
  const wob = 1 + 0.045*Math.sin(2*theta + 2.0) + 0.015*Math.sin(t*11);
  pouch.setAttribute('transform', `translate(684 127) scale(1 ${wob.toFixed(3)}) translate(-684 -127)`);
  crest.setAttribute('transform', `rotate(${(5*Math.sin(t*9) + 2*Math.sin(t*23)).toFixed(2)} 634 104)`);
  tail.setAttribute('transform', `rotate(${(1.5*Math.sin(t*8)).toFixed(2)} 466 296)`);
  prims.setAttribute('transform', `rotate(${(1.2*Math.sin(2*theta)).toFixed(2)} 690 326)`);

  // 眨眼
  if (t > nextBlink){
    const p = (t - nextBlink)/0.16;
    lid.setAttribute('ry', f1(6.6*Math.sin(Math.min(1,p)*Math.PI)));
    if (p >= 1){ lid.setAttribute('ry', 0); nextBlink = t + 2.5 + Math.random()*3; }
  }

  // 双腿 IK（髋关节跟随身体起伏）
  updateLeg(farLeg, {x:570, y:333 + bob}, theta + Math.PI, t);
  updateLeg(nearLeg, {x:580, y:338 + bob}, theta, t);

  // 尘土
  dustTimer += dt;
  if (dustTimer > 0.09){
    dustTimer = 0;
    const p = dust.find(d => t - d.born > d.life);
    if (p){
      p.born = t; p.life = 0.7 + Math.random()*0.6;
      p.x = R.x - 20 - Math.random()*20; p.y = 598 - Math.random()*4;
      p.vx = -SPEED*0.35 - Math.random()*60; p.vy = -10 - Math.random()*25;
      p.r0 = 1.5 + Math.random()*2.5;
    }
  }
  for (const p of dust){
    const age = t - p.born;
    if (age > p.life || age < 0){ p.el.setAttribute('opacity', 0); continue; }
    const k = age/p.life;
    p.el.setAttribute('cx', f1(p.x + p.vx*age));
    p.el.setAttribute('cy', f1(p.y + p.vy*age + 12*age*age));
    p.el.setAttribute('r', f1(p.r0*(1 + k*2.5)));
    p.el.setAttribute('opacity', ((1-k)*0.45).toFixed(2));
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
